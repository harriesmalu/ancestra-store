<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px; overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  .wrap {
    width: 1080px; height: 1920px;
    background: linear-gradient(160deg, #FAF3E8 0%, #EDE4D5 50%, #E5D9C8 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .bg-wash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 35%, rgba(255,248,230,0.5) 0%, transparent 55%);
    pointer-events: none;
  }

  /* Top brand */
  .eyebrow {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.55em; color: #9A7A55;
    text-transform: uppercase; white-space: nowrap;
  }

  /* Main */
  .content { padding: 0 90px; text-align: center; z-index: 2; width: 100%; }

  .icon { font-size: 64px; margin-bottom: 36px; }
  .question {
    font-size: 54px; color: #2C1F10; font-weight: normal;
    line-height: 1.2; margin-bottom: 14px;
  }
  .question em { font-style: italic; color: #7A5C38; }
  .sub-q {
    font-size: 18px; color: #7A6050; letter-spacing: 0.06em;
    margin-bottom: 56px; line-height: 1.65;
  }

  /* Option pills */
  .options { display: flex; flex-direction: column; gap: 18px; }
  .option {
    background: rgba(250,244,236,0.75);
    border: 1px solid rgba(154,122,85,0.2);
    padding: 28px 36px;
    display: flex; align-items: center; gap: 24px;
  }
  .opt-letter {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(154,122,85,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; letter-spacing: 0.1em; color: #9A7A55;
    flex-shrink: 0; background: rgba(250,244,236,0.5);
  }
  .opt-text { font-size: 22px; color: #4A3220; letter-spacing: 0.03em; text-align: left; }

  /* Bottom note */
  .note {
    margin-top: 52px;
    font-size: 15px; letter-spacing: 0.12em; color: #9A7A55;
    text-transform: uppercase; line-height: 1.7;
  }
  .note em { color: #7A5C38; font-style: normal; font-size: 17px; }

  /* Bottom bar */
  .bottom {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    text-align: center;
  }
  .cta { font-size: 10px; letter-spacing: 0.45em; color: #9A7A55; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bg-wash"></div>
  <div class="eyebrow">Ancestra Parfum</div>

  <div class="content">
    <div class="icon">💬</div>
    <div class="question">
      ¿Cuánto pagás<br>hoy por un<br><em>perfume?</em>
    </div>
    <div class="sub-q">Respondé la encuesta y<br>descubrí cuánto podés ahorrar</div>

    <div class="options">
      <div class="option">
        <div class="opt-letter">A</div>
        <div class="opt-text">Menos de $10.000</div>
      </div>
      <div class="option">
        <div class="opt-letter">B</div>
        <div class="opt-text">$10.000 — $30.000</div>
      </div>
      <div class="option">
        <div class="opt-letter">C</div>
        <div class="opt-text">$30.000 — $60.000</div>
      </div>
      <div class="option">
        <div class="opt-letter">D</div>
        <div class="opt-text">Más de $60.000 💸</div>
      </div>
    </div>

    <div class="note">
      Con Ancestra pagás<br><em>desde $18.500</em> · Alta duración
    </div>
  </div>

  <div class="bottom">
    <div class="cta">Usá el sticker de encuesta de Instagram</div>
  </div>
</div>
</body>
</html>
