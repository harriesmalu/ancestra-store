<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px; overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  .wrap {
    width: 1080px; height: 1920px;
    background: linear-gradient(175deg, #FAF4EC 0%, #F0E6D6 40%, #E8DDD0 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }

  /* Background soft circle */
  .bg-circle {
    position: absolute;
    width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,248,230,0.6) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* Top tagline */
  .eyebrow {
    position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.55em; color: #9A7A55;
    text-transform: uppercase; white-space: nowrap;
  }

  /* Main content */
  .content {
    text-align: center; z-index: 2; padding: 0 100px;
  }

  /* Bottle */
  .bottle-wrap {
    position: relative; display: inline-block; margin-bottom: 70px;
  }
  .bottle-img {
    height: 560px; width: auto;
    filter: drop-shadow(0 30px 60px rgba(80,50,20,0.2));
  }
  .lb { font-size: 10px; letter-spacing: 0.5em; color: #fff; display: block; font-family: 'Georgia', serif; }
  .ls { font-size: 7px; letter-spacing: 0.4em; color: #c9a96e; display: block; margin-top: 4px; text-transform: uppercase; }

  /* Brand name */
  .brand-name {
    font-size: 13px; letter-spacing: 0.6em; color: #9A7A55;
    text-transform: uppercase; margin-bottom: 28px;
  }
  .headline {
    font-size: 62px; color: #2C1F10; font-weight: normal;
    line-height: 1.18; margin-bottom: 28px; letter-spacing: -0.01em;
  }
  .headline em { font-style: italic; color: #7A5C38; }
  .rule { width: 40px; height: 1px; background: rgba(154,122,85,0.5); margin: 0 auto 28px; }
  .body-text {
    font-size: 21px; color: #6B5540; line-height: 1.75;
    letter-spacing: 0.03em;
  }
  .body-text strong { color: #4A3220; }

  /* Bottom */
  .bottom {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    text-align: center;
  }
  .swipe-hint { font-size: 10px; letter-spacing: 0.45em; color: #9A7A55; text-transform: uppercase; margin-bottom: 10px; }
  .url { font-size: 15px; letter-spacing: 0.2em; color: #7A5C38; }
  .url-line { width: 1px; height: 50px; background: linear-gradient(to bottom, rgba(154,122,85,0.5), transparent); margin: 14px auto 0; }
</style>
</head>
