<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body, html { width:1080px; height:1080px; overflow:hidden; background:#080808; }

  .canvas {
    width:1080px; height:1080px;
    background:#080808;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ── Mitad superior — "ellos" ── */
  .half {
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative;
  }
  .half-top {
    border-bottom: 1px solid rgba(201,169,110,0.1);
  }
  .half-top::before {
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(ellipse 70% 80% at 50% 60%, rgba(255,255,255,0.025) 0%, transparent 70%);
    pointer-events:none;
  }
  .half-bottom::before {
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(ellipse 70% 80% at 50% 40%, rgba(201,169,110,0.05) 0%, transparent 70%);
    pointer-events:none;
  }

  .eyebrow {
    font-family:'Jost', sans-serif;
    font-weight:200;
    font-size:10px;
    letter-spacing:0.5em;
    text-transform:uppercase;
    margin-bottom:14px;
    text-indent:0.5em;
  }
  .eyebrow-muted { color:#6b6560; }
  .eyebrow-gold  { color:#c9a96e; }

  .price-label {
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    line-height:1;
    letter-spacing:-0.01em;
  }
  .price-label.big   { font-size:118px; color:rgba(237,232,223,0.22); text-decoration:line-through; text-decoration-color:rgba(237,232,223,0.12); }
  .price-label.hero  { font-size:118px; color:#c9a96e; }

  .sub-label {
    font-family:'Jost', sans-serif;
    font-weight:200;
    font-size:11px;
    letter-spacing:0.38em;
    text-transform:uppercase;
    margin-top:12px;
    text-indent:0.38em;
  }
  .sub-muted { color:#6b6560; }
  .sub-gold  { color:rgba(201,169,110,0.55); }

  /* ── Botella flotante en el centro ── */
  .bottle-center {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:10;
    width:170px; height:170px;
    display:flex; align-items:center; justify-content:center;
  }
  .bottle-center img {
    height:220px; width:auto;
    object-fit:contain;
    filter:
      drop-shadow(0 0 30px rgba(201,169,110,0.18))
      drop-shadow(0 8px 24px rgba(0,0,0,0.8))
      brightness(1.05);
    -webkit-mask-image:
      radial-gradient(ellipse 80% 88% at 50% 50%,
        black 50%, rgba(0,0,0,0.85) 70%, transparent 100%);
    mask-image:
      radial-gradient(ellipse 80% 88% at 50% 50%,
        black 50%, rgba(0,0,0,0.85) 70%, transparent 100%);
  }

  /* ── Separador horizontal con etiqueta ── */
  .divider {
    position:absolute;
    top:50%; left:0; right:0;
    transform:translateY(-50%);
    z-index:5;
    display:flex; align-items:center;
    pointer-events:none;
  }
  .divider-line {
    flex:1; height:1px;
    background:linear-gradient(to right,
      transparent 0%, rgba(201,169,110,0.12) 30%,
      rgba(201,169,110,0.12) 70%, transparent 100%);
  }

  /* ── Marca — top left ── */
  .brand-mark {
    position:absolute;
    top:60px; left:72px;
    z-index:10;
  }
  .brand-mark .word {
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:18px;
    letter-spacing:0.42em;
    color:#ede8df;
  }
  .brand-mark .sub {
    font-family:'Jost', sans-serif;
    font-weight:200;
    font-size:8px;
    letter-spacing:0.45em;
    color:#c9a96e;
    text-transform:uppercase;
    margin-top:4px;
    text-indent:0.45em;
  }

  /* ── Badge ahorro — bottom right ── */
  .savings {
    position:absolute;
    bottom:64px; right:72px;
    z-index:10;
    text-align:right;
  }
  .savings-label {
    font-family:'Jost', sans-serif;
    font-weight:200;
    font-size:9px;
    letter-spacing:0.45em;
    text-transform:uppercase;
    color:#6b6560;
    text-indent:0.45em;
  }
  .savings-amount {
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:38px;
    color:#c9a96e;
    line-height:1.1;
    margin-top:2px;
  }
  .savings-sub {
    font-family:'Jost', sans-serif;
    font-weight:200;
    font-size:9px;
    letter-spacing:0.3em;
    color:rgba(160,152,144,0.45);
    text-transform:uppercase;
    margin-top:4px;
    text-indent:0.3em;
  }

  /* ── Esquinas ── */
  .corner {
    position:absolute;
    width:20px; height:20px;
    border-color:rgba(201,169,110,0.15);
    border-style:solid;
    z-index:10;
  }
  .tl { top:48px; left:48px; border-width:1px 0 0 1px; }
  .tr { top:48px; right:48px; border-width:1px 1px 0 0; }
  .bl { bottom:48px; left:48px; border-width:0 0 1px 1px; }
  .br { bottom:48px; right:48px; border-width:0 1px 1px 0; }
</style>
</head>
<body>
<div class="canvas">

  <!-- Esquinas -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Marca -->
  <div class="brand-mark">
    <div class="word">ANCESTRA</div>
    <div class="sub">Parfum</div>
  </div>

  <!-- Mitad superior: precio perfumería -->
  <div class="half half-top">
    <div class="eyebrow eyebrow-muted">Perfumería de marca</div>
    <div class="price-label big">$95.000</div>
    <div class="sub-label sub-muted">el mismo aroma · extracto 50 ml</div>
  </div>

  <!-- Divisor -->
  <div class="divider">
    <div class="divider-line"></div>
  </div>

  <!-- Mitad inferior: precio Ancestra -->
  <div class="half half-bottom">
    <div class="eyebrow eyebrow-gold">Ancestra Parfum</div>
    <div class="price-label hero">$35.000</div>
    <div class="sub-label sub-gold">alta concentración · 8–12 hs en tu piel</div>
  </div>
