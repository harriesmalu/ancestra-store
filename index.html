    <section class="layout">
<aside class="filters" id="filtersPanel">
        <button class="filterToggle" id="filterToggle" aria-expanded="false">
          <span>Filtros</span>
          <svg id="filterArrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="filtersBody" id="filtersBody">
        <label class="field">
          <span>Categoría</span>
          <select id="filterCategory"></select>
        </label>

        <label class="field">
          <span>Familia</span>
          <select id="filterFamily"></select>
        </label>

        <label class="field">
          <span>Género</span>
          <select id="filterGender"></select>
        </label>

        <label class="field">
          <span>Intensidad mínima</span>
          <input id="filterIntensity" type="range" min="0" max="5" value="0"/>
        </label>

        <label class="field">
          <span>Precio máx.</span>
          <input id="filterMaxPrice" type="number" min="0" step="500" placeholder="Sin tope"/>
          <div id="maxPriceLabel" class="muted small">Sin tope</div>
        </label>

        <button id="resetFilters" class="linkBtn">Resetear filtros</button>
        </div>
      </aside>

      <section class="content">
        <div class="contentTop">
          <div id="countLabel" class="muted">...</div>
          <div class="sortWrap">
            <label for="sort" class="muted small">Ordenar</label>
            <select id="sort" class="sort">
              <option value="name">Nombre</option>
              <option value="price_asc">Precio: menor a mayor</option>
              <option value="price_desc">Precio: mayor a menor</option>
              <option value="intensity_desc">Intensidad: mayor a menor</option>
            </select>
          </div>
        </div>

        <div id="results" class="grid"></div>
      </section>
    </section>
  </main>

  <script type="module">
    // Filter toggle for mobile (Safari iOS fix)
    const btn = document.getElementById('filterToggle');
    const body = document.getElementById('filtersBody');
    const arrow = document.getElementById('filterArrow');
    if (btn && body) {
      // On desktop always show
      const isMobile = () => window.innerWidth <= 900;
      function updateState() {
        if (!isMobile()) {
          body.style.display = '';
          btn.style.display = 'none';
        } else {
          btn.style.display = 'flex';
          const expanded = btn.getAttribute('aria-expanded') === 'true';
          body.style.display = expanded ? 'block' : 'none';
        }
      }
      btn.addEventListener('click', () => {
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', !expanded);
        body.style.display = !expanded ? 'block' : 'none';
        arrow.style.transform = !expanded ? 'rotate(180deg)' : '';
      });
      window.addEventListener('resize', updateState);
      updateState();
    }
  </script>
