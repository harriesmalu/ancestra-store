<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap');
  * { margin:0; padding:0; }
  body { position:relative; background:#000; overflow:hidden; }
  img.base { position:absolute; inset:0; }
  .name, .sizeL, .sizeR, .bsName {
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:500;
    color:#f5f1e8;
    text-transform:uppercase;
  }
  /* ── Perfume (1879×1574) ── */
  .perfume .name  { left:660px; top:905px; width:530px; height:170px; letter-spacing:.06em; line-height:1.15; }
  .perfume .cover { position:absolute; left:670px; top:1085px; width:510px; height:90px; background:#000; }
  .perfume .sizeL { left:660px; top:1092px; width:220px; height:70px; font-size:47px; letter-spacing:.1em; text-transform:none; }
  .perfume .sizeR { left:930px; top:1092px; width:250px; height:70px; font-size:47px; letter-spacing:.1em; }
  /* ── Body splash (832×1059), etiqueta x291-545, bajo SPLASH hasta y640 ── */
  .bs .bsName { left:305px; top:584px; width:232px; height:44px; letter-spacing:.12em; line-height:1; }
</style>
</head>
<body>
  <script>
    const q = new URLSearchParams(location.search);
    const mode = q.get('mode') || 'perfume';
    const name = q.get('name') || 'PERFUME';
    const ml   = q.get('ml') || '50';
    const OZ   = { '30': '1 FL. OZ', '50': '1.7 FL. OZ', '100': '3.4 FL. OZ' };
    const BASE = {
      perfume: { src: '../assets/perfume-50ml.png', w: 1879, h: 1574 },
      bs:      { src: '../assets/body-splash.png',  w: 832,  h: 1059 },
    };
    const cfg = BASE[mode];
    document.body.className = mode;
    document.body.style.width = cfg.w + 'px';
    document.body.style.height = cfg.h + 'px';
    const zoom = parseFloat(q.get('zoom') || '1');
    if (zoom !== 1) document.body.style.zoom = zoom;

    if (mode === 'perfume') {
      document.body.innerHTML = `
        <img class="base" src="${cfg.src}" width="${cfg.w}" height="${cfg.h}"/>
        <div class="cover"></div>
        <div class="name" id="fit">${name}</div>
        <div class="sizeL">${ml}ml e</div>
        <div class="sizeR">${OZ[ml] || ''}</div>`;
    } else {
      document.body.innerHTML = `
        <img class="base" src="${cfg.src}" width="${cfg.w}" height="${cfg.h}"/>
        <div class="bsName" id="fit">${name}</div>`;
    }

    // Ajuste automático: una línea primero; dos líneas solo si quedaría muy chico
    const el = document.getElementById('fit');
    const overflows = () => el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
    document.fonts.ready.then(() => {
      if (mode === 'perfume') {
        el.style.whiteSpace = 'nowrap';
        let size = 76;
        el.style.fontSize = size + 'px';
        while (overflows() && size > 54) { size -= 2; el.style.fontSize = size + 'px'; }
        if (overflows()) {
          el.style.whiteSpace = 'normal';
          size = 54;
          el.style.fontSize = size + 'px';
          while (overflows() && size > 34) { size -= 2; el.style.fontSize = size + 'px'; }
        }
      } else {
        el.style.whiteSpace = 'nowrap';
        let size = 26;
        el.style.fontSize = size + 'px';
        while (overflows() && size > 13) { size -= 1; el.style.fontSize = size + 'px'; }
      }
      document.title = 'READY';
    });
  </script>
</body>
</html>
